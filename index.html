<html>

<head>

    <title>León XIV</title>

    <style>

        body {
            background-color: #17365D;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 40px;
            color: white;
        }

        .titulo {
            text-align: center;
            padding: 20px;
        }

        .titulo h1 {
            margin-bottom: 15px;
        }

        .titulo p {
            color: white;
            font-size: 22px;
        }

        .linea {
            width: 150px;
            height: 3px;
            background-color: #C5A253;
            margin: 20px auto;
        }

        .tarjetas {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            max-width: 800px;
            margin: auto;
        }

        .tarjeta {
            background-color: white;
            border: 3px solid #C5A253;
            padding: 10px;
            margin: 10px;
            font-size: 25px;
            width: 300px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .tarjeta img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .tarjeta:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
        }

        .tarjeta a {
            color: #17365D;
            text-decoration: none;
        }

        .tarjeta a:hover {
            color: #17365D;
        }

        .ir {
            display: block;
            text-align: center;
            font-size: 20px;
        }

        footer {
            background-color: #102746;
            border-top: 2px solid #C5A253;
            text-align: center;
            padding: 10px;
            margin-top: 40px;
            color: white;
        }

        @media (max-width: 850px) {
            .presentacion {
                margin: 30px 20px;
            }
        }

    </style>

</head>

<body>

    <div class="titulo">

        <h1>Papa León XIV</h1>

        <p>
            Su vida, su historia y su visita a la Argentina
        </p>

        <div class="linea"></div>

    </div>

    <br>

    <div class="tarjetas">

        <a href="Vida.html" style="text-decoration: none;">

            <div class="tarjeta">

                <img src="vida.png" alt="La vida del Papa León XIV">

                <p align="center">Su vida</p>

                <p class="ir">
                    Conocer más
                </p>

            </div>

        </a>

        <a href="Eleccion.html" style="text-decoration: none;">

            <div class="tarjeta">

                <img src="eleccion.png" alt="La elección del Papa León XIV">

                <p align="center">Cómo llegó a ser papa</p>

                <p class="ir">
                    Conocer más
                </p>

            </div>

        </a>

        <a href="Jovenes.html" style="text-decoration: none;">

            <div class="tarjeta">

                <img src="jovenes.png" alt="León XIV y los jóvenes">

                <p align="center">León XIV y los jóvenes</p>

                <p class="ir">
                    Conocer más
                </p>

            </div>

        </a>

        <a href="Argentina.html" style="text-decoration: none;">

            <div class="tarjeta">

                <img src="argentina.png" alt="La visita del Papa a Argentina">

                <p align="center">Su visita a Argentina</p>

                <p class="ir">
                    Conocer más
                </p>

            </div>

        </a>

    </div>

    <footer>

        <p>León XIV | Su historia y su camino</p>

    </footer>

</body>

</html>
